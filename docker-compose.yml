name: projecttcc

services:
  db:
    image: postgres:16-alpine
    container_name: projectTCC
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcc}
      POSTGRES_DB: ${POSTGRES_DB:-projectTCC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - projecttcc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcc} -d ${POSTGRES_DB:-projectTCC}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  projecttcc_pgdata:
